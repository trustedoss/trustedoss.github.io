<!doctype html>
<!--
  API 키 없이 보는 샘플: OSS Rules 생성기 결과 미리보기 (정적 데이터)
  내용: website/ai-coding/rules-template.mdx 의 전체 템플릿을 아래 선택값에 맞춘 예시
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSS Rules Sample Preview</title>
    <style>
      :root {
        --border: #d7dbe0;
        --muted: #5a6270;
        --bg: #ffffff;
        --surface: #f7f8fa;
        --code-bg: #f1f3f6;
        --accent: #2a64c4;
        --text: #1f2430;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --border: #2a2f45;
          --muted: #9aa3b2;
          --bg: #1b1f2a;
          --surface: #232838;
          --code-bg: #161a24;
          --text: #e7e9ee;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        padding: 16px;
        line-height: 1.55;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 14px;
        background: var(--surface);
      }
      .ptitle {
        font-weight: 600;
        margin-bottom: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 5px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        width: 30%;
        font-weight: 600;
      }
      pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        overflow-x: auto;
        font-size: 0.82rem;
        line-height: 1.5;
        margin: 8px 0;
        white-space: pre;
      }
      code {
        font-family: "SFMono-Regular", Consolas, monospace;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .note {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 10px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="ptitle" data-i18n="inputTitle">입력: 샘플 선택값</div>
      <table>
        <tbody>
          <tr>
            <th data-i18n="thTool">AI 코딩 도구</th>
            <td>Claude Code</td>
          </tr>
          <tr>
            <th data-i18n="thLang">개발 언어</th>
            <td>JavaScript/TypeScript, Python</td>
          </tr>
          <tr>
            <th data-i18n="thLicense">라이선스 정책</th>
            <td data-i18n="licenseValue">표준 (권장): LGPL·MPL 주의</td>
          </tr>
          <tr>
            <th data-i18n="thVuln">취약점 기준</th>
            <td data-i18n="vulnValue">High 이상</td>
          </tr>
          <tr>
            <th data-i18n="thExtra">추가 규칙</th>
            <td data-i18n="extraValue">SBOM 관리, 저작권 헤더</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button id="runBtn" type="button" onclick="showResult()" data-i18n="runBtn">
      샘플 생성 결과 보기
    </button>

    <div id="result" class="hidden">
      <div class="panel">
        <div class="ptitle" data-i18n="resultTitle">결과: CLAUDE.md (예시)</div>
        <pre><code id="output"></code></pre>
        <p class="note" data-i18n="note">
          위 결과는 샘플 선택값 기준 예시입니다. 실제 생성기는 선택한 도구마다
          파일을 따로 만들고 다운로드할 수 있게 해 줍니다. 아래 도구에서 본인
          팀의 선택값으로 생성하세요.
        </p>
      </div>
    </div>

    <script>
      const OUTPUT_KO = [
        "## 오픈소스 정책",
        "",
        "### 라이선스 관리",
        "",
        "새로운 외부 패키지나 라이브러리를 추가할 때는 반드시 라이선스를 확인하고 명시할 것.",
        "",
        "- 허용 라이선스: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC",
        "- 주의 라이선스 (법무 검토 필요): LGPL, MPL, CC-BY-SA",
        "- 금지 라이선스 (사전 승인 없이 사용 불가): GPL, AGPL, SSPL, Commons Clause",
        "",
        "### 보안 관리",
        "",
        "- High 이상 CVE 가 알려진 패키지 버전은 사용하지 말 것",
        "- 의존성을 추가한 뒤 아래 명령을 실행할 것",
        "  - JavaScript/TypeScript: `npm audit --audit-level=high`",
        "  - Python: `pip-audit`",
        "- 패키지 버전은 가능하면 최신 안정 버전을 사용할 것",
        "",
        "### SBOM 관리",
        "",
        "- 의존성이 바뀌면 SBOM 을 갱신할 것",
        "- 생성 도구: cdxgen, syft, trivy",
        "- 권장 형식: CycloneDX (차선: SPDX)",
        "",
        "### 저작권",
        "",
        "- 기존 코드의 저작권 헤더를 유지할 것",
        "- 새 파일을 만들 때 프로젝트 라이선스 헤더를 넣을 것",
        "- 다른 프로젝트의 코드를 복사할 때는 출처와 라이선스를 적을 것",
      ].join("\n");

      const OUTPUT_EN = [
        "## Open source policy",
        "",
        "### License management",
        "",
        "When you add an external package or library, always check its license and record it.",
        "",
        "- Allowed licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC",
        "- Licenses that need legal review: LGPL, MPL, CC-BY-SA",
        "- Forbidden without prior approval: GPL, AGPL, SSPL, Commons Clause",
        "",
        "### Security",
        "",
        "- Do not use package versions with known CVEs rated High or above",
        "- After adding a dependency, run one of these commands",
        "  - JavaScript/TypeScript: `npm audit --audit-level=high`",
        "  - Python: `pip-audit`",
        "- Prefer the latest stable version of each package",
        "",
        "### SBOM management",
        "",
        "- Update the SBOM when dependencies change",
        "- Tools: cdxgen, syft, trivy",
        "- Preferred format: CycloneDX (alternative: SPDX)",
        "",
        "### Copyright",
        "",
        "- Keep existing copyright headers",
        "- Add the project license header to new files",
        "- When copying code from another project, record its source and license",
      ].join("\n");

      const I18N = {
        ko: {
          docTitle: "OSS Rules 샘플 미리보기",
          inputTitle: "입력: 샘플 선택값",
          thTool: "AI 코딩 도구",
          thLang: "개발 언어",
          thLicense: "라이선스 정책",
          thVuln: "취약점 기준",
          thExtra: "추가 규칙",
          licenseValue: "표준 (권장): LGPL·MPL 주의",
          vulnValue: "High 이상",
          extraValue: "SBOM 관리, 저작권 헤더",
          runBtn: "샘플 생성 결과 보기",
          resultTitle: "결과: CLAUDE.md (예시)",
          note: "위 결과는 샘플 선택값 기준 예시입니다. 실제 생성기는 선택한 도구마다 파일을 따로 만들고 다운로드할 수 있게 해 줍니다. 아래 도구에서 본인 팀의 선택값으로 생성하세요.",
          output: OUTPUT_KO,
        },
        en: {
          docTitle: "OSS Rules Sample Preview",
          inputTitle: "Input: sample selections",
          thTool: "AI coding tool",
          thLang: "Languages",
          thLicense: "License policy",
          thVuln: "Vulnerability threshold",
          thExtra: "Extra rules",
          licenseValue: "Standard (recommended): review LGPL and MPL",
          vulnValue: "High or above",
          extraValue: "SBOM management, copyright headers",
          runBtn: "Show the sample result",
          resultTitle: "Result: CLAUDE.md (example)",
          note: "This is an example based on the sample selections. The real generator creates a separate file for each tool you choose and lets you download it. Generate your own in the tool below.",
          output: OUTPUT_EN,
        },
      };

      const LANG =
        new URLSearchParams(window.location.search).get("lang") === "en"
          ? "en"
          : "ko";
      const T = I18N[LANG];

      document.documentElement.lang = LANG;
      document.title = T.docTitle;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const v = T[el.dataset.i18n];
        if (typeof v === "string") el.textContent = v;
      });
      document.getElementById("output").textContent = T.output;

      function showResult() {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("runBtn").classList.add("hidden");
      }
    </script>
  </body>
</html>
