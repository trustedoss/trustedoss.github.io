name: DCO

on:
  pull_request:
    branches:
      - main

jobs:
  check-sign-off:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check every commit for a sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with 'git commit --amend -s' (single commit) or"
            echo "'git rebase --signoff ${BASE_SHA}' (several commits), then force-push."
            exit 1
          fi

          echo "All commits are signed off."
