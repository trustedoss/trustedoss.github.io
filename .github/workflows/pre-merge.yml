name: Pre-merge

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Check lock for duplications
        run: yarn dedupe --check

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check dependencies alignment
        run: yarn check-dependencies

      - name: Run packages lint
        run: yarn lint:packages

      - name: Run plugins lint
        run: yarn lint:plugins

  lint-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Website Specific Lints
        working-directory: website
        run: yarn ci:lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        working-directory: website
        env:
          NODE_OPTIONS: --max_old_space_size=8192

  static-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Layer 5 가 base 와 비교해 변경분을 고른다. 얕은 클론이면 base 가 없다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build website (Docusaurus)
        run: yarn build
        working-directory: website
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Install Python dependencies
        # anthropic 은 Layer 3 카세트 재생, pyyaml 은 Layer 4 코드블록 검사에 쓴다.
        run: pip install anthropic pyyaml

      - name: Layer 1 — Agent 스펙 구조
        run: python3 .claude/scripts/test-agent-specs.py

      - name: Layer 2 — 골든 픽스처 회귀
        run: python3 .claude/scripts/test-output-fixtures.py

      - name: Layer 3-lite — 체인 연결
        run: python3 .claude/scripts/validate-chain.py --dir output-sample

      - name: Layer 3 — E2E 카세트 재생
        run: python3 .claude/scripts/test-agent-e2e.py --all --verbose

      - name: ISO 커버리지 정합성
        run: python3 .claude/scripts/test-coverage.py

      - name: output/ 산출물 완전성
        run: python3 .claude/scripts/validate-output.py

      # 문서 코드블록 검사에 쓴다. 이동 태그 대신 버전을 고정한다.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          actionlint --version

      # 검사기가 실제로 도는지 먼저 확인한다. 결과가 0건일 때 그것이 진짜 0인지
      # 검사기가 아무것도 안 본 것인지 구분되지 않으면 이 단계는 의미가 없다.
      - name: Layer 4 자체 점검
        run: python3 .claude/scripts/check-code-blocks.py --selftest

      - name: Layer 4 코드블록 문법
        run: python3 .claude/scripts/check-code-blocks.py

      # 외부 참조는 우리가 문서를 고치지 않아도 깨질 수 있다. PR 에서는 이번 변경으로
      # 들어온 참조만 본다. 전량 확인은 example-refs.yml 이 주간으로 돌린다.
      - name: Layer 5 외부 참조 (변경분)
        run: |
          python3 .claude/scripts/check-code-refs.py \
            --changed "origin/${{ github.base_ref }}"
